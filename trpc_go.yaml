# 全局配置
global:
  namespace: Development
  env_name: dev

# 服务端配置
server:
  app: elysia
  server: access
  service:
    # HTTP REST API 服务
    - name: trpc.elysia.access.http
      ip: 0.0.0.0
      port: 8190
      network: tcp
      protocol: http_no_protocol
      timeout: 3000
    # Access RPC 服务
    - name: trpc.elysia.access.AccessService
      ip: 0.0.0.0
      port: 8091
      network: tcp
      protocol: trpc
      timeout: 3000
    # 内容安全审核 RPC 服务
    - name: trpc.elysia.access.content_security.ContentSecurityService
      ip: 0.0.0.0
      port: 8092
      network: tcp
      protocol: trpc
      timeout: 5000

  # 管理端口配置
  admin:
    ip: 127.0.0.1
    port: 9027
    read_timeout: 3000
    write_timeout: 3000

# 插件配置
plugins:
  # 日志配置
  log:
    default:
      - writer: console
        level: debug
        format: console
      - writer: file
        level: info
        format: json
        writer_config:
          filename: ./logs/trpc.log
          max_size: 100
          max_backups: 10
          max_age: 7
          compress: false